name: f1_demo
version: 3.0.0
config-version: 2
profile: f1_demo
model-paths:
- models
macro-paths:
- macros
function-paths:
- functions
models:
  f1_demo:
    agents:
      +schema: agents
      +materialized: table
      +tags: [agents_schema]
    documents:
      +tags: [document_search]
    openf1:
      +materialized: table
      +tags:
      - normalized_openf1
on-run-start:
- >-
    create connection if not exists `{{ target.database }}.us.f1_document_embeddings`
    options (connection_type = "CLOUD_RESOURCE", friendly_name = "F1 document embeddings")
