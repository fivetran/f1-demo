name: f1_demo
version: 3.0.0
config-version: 2
profile: f1_demo
dbt-cloud:
  project-id: "{{ env_var('DBT_CLOUD_PROJECT_ID', '0') | int }}"
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
seed-paths:
- seeds
seeds:
  f1_demo:
    agents:
      +schema: agents_seed
      +tags: [agents_schema]
      +quote_columns: true
      +labels:
        publisher: f1-demo-agents
models:
  f1_demo:
    search:
      +tags:
      - document_search
    openf1:
      +materialized: table
      +tags:
      - normalized_openf1
on-run-start:
- '{{ assert_analytics_target() }}'
on-run-end:
- '{{ publish_agents_after_run(results) }}'
