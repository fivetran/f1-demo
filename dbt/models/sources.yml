version: 2
sources:
- name: openf1
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_OPENF1_DATASET'', ''f1_openf1'') }}'
  tables:
  - name: car_data
    description: 'Connector primary key: session_key, driver_number, date.'
    columns:
    - name: brake
      data_type: INT64
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: drs
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: n_gear
      data_type: INT64
    - name: rpm
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: speed
      data_type: INT64
    - name: throttle
      data_type: INT64
  - name: championship_drivers
    description: 'Connector primary key: session_key, driver_number.'
    columns:
    - name: driver_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: points_current
      data_type: FLOAT64
    - name: points_start
      data_type: FLOAT64
    - name: position_current
      data_type: INT64
    - name: position_start
      data_type: INT64
    - name: session_key
      data_type: INT64
  - name: championship_teams
    description: 'Connector primary key: session_key, team_name.'
    columns:
    - name: meeting_key
      data_type: INT64
    - name: points_current
      data_type: FLOAT64
    - name: points_start
      data_type: FLOAT64
    - name: position_current
      data_type: INT64
    - name: position_start
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: team_name
      data_type: STRING
  - name: drivers
    description: 'Connector primary key: session_key, driver_number.'
    columns:
    - name: broadcast_name
      data_type: STRING
    - name: country_code
      data_type: STRING
    - name: driver_number
      data_type: INT64
    - name: first_name
      data_type: STRING
    - name: full_name
      data_type: STRING
    - name: headshot_url
      data_type: STRING
    - name: last_name
      data_type: STRING
    - name: meeting_key
      data_type: INT64
    - name: name_acronym
      data_type: STRING
    - name: session_key
      data_type: INT64
    - name: team_colour
      data_type: STRING
    - name: team_name
      data_type: STRING
  - name: intervals
    description: 'Connector primary key: session_key, driver_number, date.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: gap_to_leader
      data_type: STRING
    - name: interval
      data_type: STRING
    - name: meeting_key
      data_type: INT64
    - name: session_key
      data_type: INT64
  - name: laps
    description: 'Connector primary key: session_key, driver_number, lap_number.'
    columns:
    - name: date_start
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: duration_sector_1
      data_type: FLOAT64
    - name: duration_sector_2
      data_type: FLOAT64
    - name: duration_sector_3
      data_type: FLOAT64
    - name: i_1_speed
      data_type: INT64
    - name: i_2_speed
      data_type: INT64
    - name: is_pit_out_lap
      data_type: BOOL
    - name: lap_duration
      data_type: FLOAT64
    - name: lap_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: segments_sector_1
      data_type: JSON
    - name: segments_sector_2
      data_type: JSON
    - name: segments_sector_3
      data_type: JSON
    - name: session_key
      data_type: INT64
    - name: st_speed
      data_type: INT64
  - name: location
    description: 'Connector primary key: session_key, driver_number, date.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: x
      data_type: INT64
    - name: y
      data_type: INT64
    - name: z
      data_type: INT64
  - name: meetings
    description: 'Connector primary key: meeting_key.'
    columns:
    - name: circuit_key
      data_type: INT64
    - name: circuit_image
      data_type: STRING
    - name: circuit_info_url
      data_type: STRING
    - name: circuit_short_name
      data_type: STRING
    - name: circuit_type
      data_type: STRING
    - name: country_code
      data_type: STRING
    - name: country_flag
      data_type: STRING
    - name: country_key
      data_type: INT64
    - name: country_name
      data_type: STRING
    - name: date_end
      data_type: TIMESTAMP
    - name: date_start
      data_type: TIMESTAMP
    - name: gmt_offset
      data_type: STRING
    - name: is_cancelled
      data_type: BOOL
    - name: location
      data_type: STRING
    - name: meeting_key
      data_type: INT64
    - name: meeting_name
      data_type: STRING
    - name: meeting_official_name
      data_type: STRING
    - name: year
      data_type: INT64
  - name: overtakes
    description: 'Connector primary key: session_key, date, overtaking_driver_number,
      overtaken_driver_number.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: meeting_key
      data_type: INT64
    - name: overtaken_driver_number
      data_type: INT64
    - name: overtaking_driver_number
      data_type: INT64
    - name: position
      data_type: INT64
    - name: session_key
      data_type: INT64
  - name: pit
    description: 'Connector primary key: session_key, driver_number, date.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: lane_duration
      data_type: FLOAT64
    - name: lap_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: pit_duration
      data_type: FLOAT64
    - name: session_key
      data_type: INT64
    - name: stop_duration
      data_type: FLOAT64
  - name: position
    description: 'Connector primary key: session_key, driver_number, date.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: position
      data_type: INT64
    - name: session_key
      data_type: INT64
  - name: race_control
    description: 'Connector primary key: session_key, message_id.'
    columns:
    - name: category
      data_type: STRING
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: flag
      data_type: STRING
    - name: lap_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: message
      data_type: STRING
    - name: qualifying_phase
      data_type: STRING
    - name: scope
      data_type: STRING
    - name: sector
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: message_id
      data_type: STRING
  - name: sessions
    description: 'Connector primary key: session_key.'
    columns:
    - name: circuit_key
      data_type: INT64
    - name: circuit_short_name
      data_type: STRING
    - name: country_code
      data_type: STRING
    - name: country_key
      data_type: INT64
    - name: country_name
      data_type: STRING
    - name: date_end
      data_type: TIMESTAMP
    - name: date_start
      data_type: TIMESTAMP
    - name: gmt_offset
      data_type: STRING
    - name: is_cancelled
      data_type: BOOL
    - name: location
      data_type: STRING
    - name: meeting_key
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: session_name
      data_type: STRING
    - name: session_type
      data_type: STRING
    - name: year
      data_type: INT64
  - name: session_result
    description: 'Connector primary key: session_key, driver_number.'
    columns:
    - name: dnf
      data_type: BOOL
    - name: dns
      data_type: BOOL
    - name: dsq
      data_type: BOOL
    - name: driver_number
      data_type: INT64
    - name: duration
      data_type: FLOAT64
    - name: gap_to_leader
      data_type: STRING
    - name: number_of_laps
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: position
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: points
      data_type: FLOAT64
  - name: starting_grid
    description: 'Connector primary key: session_key, driver_number. session_key is
      the Grand Prix qualifying session; associate with the race through meeting_key.
      This is the grid published by OpenF1 for qualifying.'
    columns:
    - name: driver_number
      data_type: INT64
    - name: lap_duration
      data_type: FLOAT64
    - name: meeting_key
      data_type: INT64
    - name: position
      data_type: INT64
    - name: session_key
      data_type: INT64
  - name: stints
    description: 'Connector primary key: session_key, driver_number, stint_number.'
    columns:
    - name: compound
      data_type: STRING
    - name: driver_number
      data_type: INT64
    - name: lap_end
      data_type: INT64
    - name: lap_start
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: stint_number
      data_type: INT64
    - name: tyre_age_at_start
      data_type: INT64
  - name: team_radio
    description: 'Connector primary key: session_key, driver_number, date, recording_url.'
    columns:
    - name: date
      data_type: TIMESTAMP
    - name: driver_number
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: recording_url
      data_type: STRING
    - name: session_key
      data_type: INT64
  - name: weather
    description: 'Connector primary key: session_key, date.'
    columns:
    - name: air_temperature
      data_type: FLOAT64
    - name: date
      data_type: TIMESTAMP
    - name: humidity
      data_type: FLOAT64
    - name: meeting_key
      data_type: INT64
    - name: pressure
      data_type: FLOAT64
    - name: rainfall
      data_type: INT64
    - name: session_key
      data_type: INT64
    - name: track_temperature
      data_type: FLOAT64
    - name: wind_direction
      data_type: INT64
    - name: wind_speed
      data_type: FLOAT64
  - name: sync_status
    description: 'Connector primary key: endpoint, scope.'
    columns:
    - name: endpoint
      data_type: STRING
    - name: scope
      data_type: STRING
    - name: session_key
      data_type: INT64
    - name: driver_number
      data_type: INT64
    - name: status
      data_type: STRING
    - name: row_count
      data_type: INT64
    - name: completed_at
      data_type: TIMESTAMP
- name: documents
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_DOCUMENTS_DATASET'', ''f1_documents'') }}'
  tables:
  - name: transcripts
    description: 'Connector primary key: document_id.'
    columns:
    - name: document_id
      data_type: STRING
    - name: source_url
      data_type: STRING
    - name: title
      data_type: STRING
    - name: published_at
      data_type: STRING
    - name: content_hash
      data_type: STRING
    - name: source_hash
      data_type: STRING
    - name: parser_version
      data_type: STRING
    - name: full_text
      data_type: STRING
    - name: section_count
      data_type: INT64
    - name: meeting_key
      data_type: INT64
    - name: race_name
      data_type: STRING
    - name: conference_type
      data_type: STRING
    - name: association_method
      data_type: STRING
  - name: transcript_passages
    description: 'Connector primary key: document_id, position.'
    columns:
    - name: document_id
      data_type: STRING
    - name: position
      data_type: INT64
    - name: text
      data_type: STRING
    - name: question
      data_type: STRING
    - name: speaker
      data_type: STRING
    - name: section
      data_type: STRING
    - name: page_number
      data_type: INT64
  - name: regulations
    description: 'Connector primary key: document_id.'
    columns:
    - name: document_id
      data_type: STRING
    - name: source_url
      data_type: STRING
    - name: title
      data_type: STRING
    - name: published_at
      data_type: STRING
    - name: content_hash
      data_type: STRING
    - name: source_hash
      data_type: STRING
    - name: parser_version
      data_type: STRING
    - name: full_text
      data_type: STRING
    - name: section_count
      data_type: INT64
    - name: applicable_season
      data_type: INT64
    - name: rule_family
      data_type: STRING
    - name: applicability_status
      data_type: STRING
    - name: effective_from
      data_type: STRING
    - name: effective_to
      data_type: STRING
  - name: regulation_sections
    description: 'Connector primary key: document_id, position.'
    columns:
    - name: document_id
      data_type: STRING
    - name: position
      data_type: INT64
    - name: text
      data_type: STRING
    - name: question
      data_type: STRING
    - name: speaker
      data_type: STRING
    - name: section
      data_type: STRING
    - name: page_number
      data_type: INT64
  - name: glossary
    description: 'Connector primary key: document_id.'
    columns:
    - name: document_id
      data_type: STRING
    - name: source_url
      data_type: STRING
    - name: title
      data_type: STRING
    - name: published_at
      data_type: STRING
    - name: content_hash
      data_type: STRING
    - name: source_hash
      data_type: STRING
    - name: parser_version
      data_type: STRING
    - name: full_text
      data_type: STRING
    - name: section_count
      data_type: INT64
    - name: applicability_status
      data_type: STRING
  - name: glossary_sections
    description: 'Connector primary key: document_id, position.'
    columns:
    - name: document_id
      data_type: STRING
    - name: position
      data_type: INT64
    - name: text
      data_type: STRING
    - name: question
      data_type: STRING
    - name: speaker
      data_type: STRING
    - name: section
      data_type: STRING
    - name: page_number
      data_type: INT64
  - name: fetch_status
    description: 'Connector primary key: source_url.'
    columns:
    - name: source_url
      data_type: STRING
    - name: status
      data_type: STRING
    - name: detail
      data_type: STRING
    - name: checked_at
      data_type: TIMESTAMP
