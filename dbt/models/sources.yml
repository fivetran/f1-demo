# Maintain source tables alongside connector changes; add columns only for useful descriptions or tests.
version: 2
sources:
- name: openf1
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_OPENF1_DATASET'', ''f1_openf1'') }}'
  tables:
  - name: car_data
  - name: championship_drivers
  - name: championship_teams
  - name: drivers
  - name: intervals
  - name: laps
  - name: location
  - name: meetings
  - name: overtakes
  - name: pit
  - name: position
  - name: race_control
  - name: sessions
  - name: session_result
  - name: starting_grid
  - name: stints
  - name: team_radio
  - name: weather
  - name: sync_status
- name: documents
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_DOCUMENTS_DATASET'', ''f1_documents'') }}'
  tables:
  - name: transcripts
    description: Press-conference metadata; join transcript_passages by document_id.
  - name: transcript_passages
    description: Complete ordered interview text with speaker and question context; indexed directly.
  - name: regulations
    description: Regulation edition and applicability metadata; join regulation_sections by document_id.
  - name: regulation_sections
    description: Complete numbered sections with starting PDF page; indexed directly.
  - name: glossary
    description: Glossary page metadata and citation URL; join glossary_sections by document_id.
  - name: glossary_sections
    description: Complete prose grouped under HTML headings; indexed directly.
  - name: fetch_status
