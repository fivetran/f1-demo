# Maintain source tables alongside connector changes; add columns only for useful descriptions or tests.
version: 2
sources:
- name: openf1
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_OPENF1_DATASET'', ''f1_openf1'') }}'
  tables:
  - name: car_data
  - name: championship_drivers
  - name: championship_teams
  - name: drivers
  - name: intervals
  - name: laps
  - name: location
  - name: meetings
  - name: overtakes
  - name: pit
  - name: position
  - name: race_control
  - name: sessions
  - name: session_result
  - name: starting_grid
  - name: stints
  - name: team_radio
  - name: weather
  - name: sync_status
- name: documents
  database: '{{ env_var(''F1_GCP_PROJECT'', ''__F1_GCP_PROJECT__'') }}'
  schema: '{{ env_var(''F1_DOCUMENTS_DATASET'', ''f1_documents'') }}'
  tables:
  - name: transcripts
  - name: transcript_passages
  - name: regulations
  - name: regulation_sections
  - name: glossary
  - name: glossary_sections
  - name: fetch_status
