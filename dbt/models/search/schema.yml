version: 2
models:
- name: transcript_search_input
  description: Active complete transcript passages, with source-specific context.
- name: transcript_passages_search
  description: Incremental transcript search corpus with original blocks, citations, managed embeddings and hybrid search. Read complete blocks once with chunk_index = 0.
  data_tests:
  - valid_key:
      arguments:
        columns: [passage_id]
- name: regulation_search_input
  description: Active semantic regulation sections, each used intact as one search chunk.
- name: regulation_passages_search
  description: Incremental regulation search corpus with original blocks, citations, managed embeddings and hybrid search. Read complete blocks once with chunk_index = 0.
  data_tests:
  - valid_key:
      arguments:
        columns: [passage_id]
- name: glossary_search_input
  description: Active complete glossary passages, with source-specific context.
- name: glossary_passages_search
  description: Incremental glossary search corpus with original blocks, citations, managed embeddings and hybrid search. Read complete blocks once with chunk_index = 0.
  data_tests:
  - valid_key:
      arguments:
        columns: [passage_id]
