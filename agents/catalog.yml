- join_name: entry_to_driver_standings
  from_table: f1.session_entries
  to_table: f1.driver_standings
  join_type: one-one
  sql_expression: l.session_key = r.session_key AND l.driver_id = r.driver_id
  description: Optional one-to-one lookup for entrants. LEFT JOIN preserves entries; start from standings to retain
    nonparticipants. Never sum checkpoint points across sessions.
- join_name: team_appearance_to_standings
  from_table: f1.team_sessions
  to_table: f1.team_standings
  join_type: one-one
  sql_expression: l.session_key = r.session_key AND l.team_id = r.team_id
  description: Optional championship checkpoint for a team appearance; LEFT JOIN preserves appearances.
- join_name: qualifying_to_race
  from_table: f1.sessions
  to_table: f1.sessions
  join_type: one-one
  sql_expression: l.meeting_key = r.meeting_key AND l.session_name = 'Qualifying' AND r.session_name = 'Race' AND
    NOT COALESCE(l.is_cancelled, FALSE) AND NOT COALESCE(r.is_cancelled, FALSE)
  description: 'Role-playing session join: l is main Qualifying, r is main Race. Excludes Sprint Qualifying. Filter
    the left input to Qualifying for this path. To compare grids to results, also match grid.driver_id to the Race
    entry.driver_id; otherwise this path expands to all entrants.'
- join_name: pit_to_lap
  from_table: f1.pit
  to_table: f1.laps
  join_type: many-one
  sql_expression: l.session_key = r.session_key AND l.driver_number = r.driver_number AND l.lap_number = r.lap_number
  description: 'Optional source lap reference; LEFT JOIN retains pit events lacking a lap. Multiple pit events can
    refer to one lap: lap measures would be repeated.'
- join_name: race_control_to_lap
  from_table: f1.race_control
  to_table: f1.laps
  join_type: many-one
  sql_expression: l.session_key = r.session_key AND l.driver_number = r.driver_number AND l.lap_number = r.lap_number
  description: Optional exact driver/lap reference only. LEFT JOIN retains global or unmatched messages. Does not
    label every lap affected by the message.
- join_name: search_chunks_to_meeting
  from_table: f1.document_passages_search
  to_table: f1.meetings
  join_type: many-one
  sql_expression: l.meeting_key = r.meeting_key
  description: Transcript chunks retain the parent meeting association. Regulations and glossary have null meeting_key
    and require LEFT JOIN to preserve them; this is not a rule-applicability association.
