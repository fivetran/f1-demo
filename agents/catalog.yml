spec_url: https://github.com/dbt-labs/agents_schema/blob/a0bc90498302c8abb15a5e98a54c8c94df5a52f8/SPEC.md
provider: f1
tables:
- table_name: f1.car_data
  description: One driver/session telemetry sample at its source timestamp. Pre/post-race samples are retained.
  primary_key:
  - session_key
  - driver_number
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: brake
    data_type: INTEGER
    description: Raw brake code. Documented 0=not pressed and 100=pressed; 1,160,081 profiled 2025 samples contain undocumented
      104. Preserve those values but do not silently decode 104 as pressed.
  - column_name: drs
    data_type: INTEGER
    description: Raw DRS code, not a Boolean. Observed codes include undocumented 11,13,15 as well as known and
      uncertain codes. No automatic activation-time measure is offered.
  - column_name: n_gear
    data_type: INTEGER
    description: Raw gear code. Documented range is 0 (neutral) to 8; 474 profiled 2025 samples exceed 8, including within
      scheduled Race windows. Do not interpret those codes as real extra gears.
  - column_name: rpm
    data_type: INTEGER
    description: Engine revolutions per minute at the sample.
  - column_name: speed
    data_type: INTEGER
    description: Instantaneous speed in km/h.
  - column_name: throttle
    data_type: INTEGER
    description: Raw source throttle percentage. Observed range is 0..104 with 1,157,156 profiled 2025 values above 100. Range-filtered
      means exclude and report these samples; do not silently clamp them.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: maximum_speed_kmh
    sql_expression: MAX(t.speed)
    description: Peak sampled speed. Filter the intended observation window; source includes pre/post-race samples.
  - measure_name: average_sample_speed_kmh
    sql_expression: AVG(t.speed)
    description: Sample-weighted speed, not time-weighted speed, lap speed, or distance divided by elapsed time.
  - measure_name: maximum_rpm
    sql_expression: MAX(t.rpm)
    description: Peak sampled engine rpm.
  - measure_name: average_sample_throttle_pct
    sql_expression: AVG(IF(t.throttle BETWEEN 0 AND 100, t.throttle, NULL))
    description: Sample-weighted mean restricted to the documented 0..100 percentage range. Excludes values above
      100; report valid_throttle_samples and row_count. Not elapsed time at full throttle.
  - measure_name: braking_sample_fraction
    sql_expression: SAFE_DIVIDE(COUNTIF(t.brake = 100), COUNTIF(t.brake IN (0, 100)))
    description: Fraction pressed among documented 0/100 codes only. Excludes undocumented 104 and nulls. Report
      known_brake_samples and row_count; not elapsed braking time.
  - measure_name: valid_throttle_samples
    sql_expression: COUNTIF(t.throttle BETWEEN 0 AND 100)
    description: Sample count used by the range-filtered throttle mean; compare to row_count.
  - measure_name: known_brake_samples
    sql_expression: COUNTIF(t.brake IN (0, 100))
    description: Samples whose brake code is documented; denominator for braking_sample_fraction.
  - measure_name: unusual_gear_samples
    sql_expression: COUNTIF(t.n_gear NOT BETWEEN 0 AND 8)
    description: Raw samples outside documented gear range. Diagnostic only; do not map them to real gears.
- table_name: f1.circuits
  description: One source circuit. Image, information URL and locality describe the latest calendar meeting;
    these presentation fields are not historical versions of the circuit.
  primary_key:
  - circuit_key
  row_filter: 'TRUE'
  dimensions:
  - column_name: circuit_key
    data_type: INTEGER
    description: OpenF1 circuit identifier.
  - column_name: country_key
    data_type: INTEGER
    description: OpenF1 venue-country identifier; a key, never an additive measure.
  - column_name: circuit_short_name
    data_type: STRING
    description: Short source circuit name.
  - column_name: circuit_type
    data_type: STRING
    description: Source circuit classification, for example permanent or street.
  - column_name: circuit_image
    data_type: STRING
    description: Circuit image URL from the latest calendar meeting.
  - column_name: circuit_info_url
    data_type: STRING
    description: Circuit information URL from the latest calendar meeting; its season can differ from the race being analyzed.
  - column_name: location
    data_type: STRING
    description: Venue locality from the latest calendar meeting; not a telemetry coordinate.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.countries
  description: One country identified by the OpenF1 country_key. Venue geography only; driver country_code is preserved
    separately and may be null.
  primary_key:
  - country_key
  row_filter: 'TRUE'
  dimensions:
  - column_name: country_key
    data_type: INTEGER
    description: OpenF1 venue-country identifier; a key, never an additive measure.
  - column_name: country_code
    data_type: STRING
    description: Source country code. In drivers this is entirely null in the profiled 2025 data; do not infer nationality.
  - column_name: country_name
    data_type: STRING
    description: Venue country name.
  - column_name: country_flag
    data_type: STRING
    description: Source country flag image reference.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.driver_standings
  description: One driver championship checkpoint per Race session, including drivers who did not enter that race.
    Points and positions are cumulative, not the race result. Source checkpoint snapshots may disagree with later
    classified results; driver checkpoint changes differ from Race result points in 23 profiled 2025 rows.
  primary_key:
  - session_key
  - driver_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: driver_id
    data_type: STRING
    description: Canonical person ID derived from source names; not guaranteed stable across spelling changes or
      future seasons.
  - column_name: points_current
    data_type: FLOAT
    description: Championship points as recorded at this session checkpoint. May reflect a during/post-race state
      that omits later corrections; never sum across checkpoints.
  - column_name: points_start
    data_type: FLOAT
    description: Cumulative championship points before this checkpoint. Not race points.
  - column_name: position_current
    data_type: INTEGER
    description: Championship rank as recorded at this session checkpoint, potentially before later corrections;
      lower is better; not additive.
  - column_name: position_start
    data_type: INTEGER
    description: Championship rank before this checkpoint; lower is better.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: checkpoint_points
    sql_expression: SUM(t.points_current)
    description: 'SEMI-ADDITIVE: filter to exactly one session checkpoint first. Sum across distinct drivers/teams
      only; never sum across checkpoints. Do not replace latest points with MAX(points), because adjustments can
      reduce points. Source snapshot may predate later result corrections.'
  - measure_name: checkpoint_points_change
    sql_expression: SUM(t.points_current - t.points_start)
    description: Change within the recorded before/after checkpoint. Not guaranteed to equal Race result points
      or cover Sprint points between snapshots; do not call this complete seasonal points earned. Source snapshot
      may predate later result corrections.
  - measure_name: checkpoint_rank
    sql_expression: MIN(t.position_current)
    description: Filter to exactly one checkpoint and one driver/team. MIN is a scalar projection at that grain,
      not a seasonal rank or meaningful rank across entities. Source snapshot may predate later result corrections.
- table_name: f1.drivers
  description: One person per driver_id. IDs are not guaranteed to identify the same person across spelling changes
    or future seasons; use session_entries to associate a person with a car number in a session.
  primary_key:
  - driver_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: driver_id
    data_type: STRING
    description: Canonical person ID derived from source names; not guaranteed stable across spelling changes or
      future seasons.
  - column_name: broadcast_name
    data_type: STRING
    description: Driver display name used in broadcasts.
  - column_name: country_code
    data_type: STRING
    description: Source country code. In drivers this is entirely null in the profiled 2025 data; do not infer nationality.
  - column_name: first_name
    data_type: STRING
    description: Source driver given name.
  - column_name: full_name
    data_type: STRING
    description: Source driver full display name.
  - column_name: headshot_url
    data_type: STRING
    description: Latest non-null driver portrait URL by session time across the loaded seasons.
  - column_name: last_name
    data_type: STRING
    description: Source driver surname.
  - column_name: name_acronym
    data_type: STRING
    description: Source short driver abbreviation; use driver_id as the join key.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.intervals
  description: One timestamped gap observation. Gap strings preserve labels such as +1 LAP.
  primary_key:
  - session_key
  - driver_number
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: gap_to_leader
    data_type: STRING
    description: 'Source gap string: seconds or labels such as +1 LAP. Preserve labels; SAFE_CAST only parses numeric
      gaps.'
  - column_name: interval
    data_type: STRING
    description: 'Source gap to the car ahead: numeric seconds or lap/status labels. Null is not zero.'
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: average_numeric_interval_seconds
    sql_expression: AVG(SAFE_CAST(t.interval AS FLOAT64))
    description: Mean numeric gap observations only. Excludes lap/status labels and nulls; sample-weighted, with
      a potentially biased subset. Always report numeric coverage.
  - measure_name: numeric_interval_count
    sql_expression: COUNT(SAFE_CAST(t.interval AS FLOAT64))
    description: Number of gap observations parseable as seconds; compare with row_count to expose lap-label/null
      exclusions.
  - measure_name: average_numeric_gap_to_leader_seconds
    sql_expression: AVG(SAFE_CAST(t.gap_to_leader AS FLOAT64))
    description: Mean numeric gap observations only. Excludes lap/status labels and nulls; sample-weighted, with
      a potentially biased subset. Always report numeric coverage.
  - measure_name: numeric_gap_to_leader_count
    sql_expression: COUNT(SAFE_CAST(t.gap_to_leader AS FLOAT64))
    description: Number of gap observations parseable as seconds; compare with row_count to expose lap-label/null
      exclusions.
- table_name: f1.laps
  description: One entry lap. Incomplete timings and JSON sector segment arrays are preserved; no inferred weather/telemetry
    joins.
  primary_key:
  - session_key
  - driver_number
  - lap_number
  row_filter: 'TRUE'
  dimensions:
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: lap_number
    data_type: INTEGER
    description: Lap ordinal within a driver/session; not an elapsed count to sum.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: date_start
    data_type: TIMESTAMP
    description: Source lap start timestamp in UTC; may be null for incomplete observations.
  - column_name: duration_sector_1
    data_type: FLOAT
    description: Sector 1 duration in seconds; null means unavailable.
  - column_name: duration_sector_2
    data_type: FLOAT
    description: Sector 2 duration in seconds; null means unavailable.
  - column_name: duration_sector_3
    data_type: FLOAT
    description: Sector 3 duration in seconds; null means unavailable.
  - column_name: i_1_speed
    data_type: INTEGER
    description: Speed at intermediate trap 1 in km/h.
  - column_name: i_2_speed
    data_type: INTEGER
    description: Speed at intermediate trap 2 in km/h.
  - column_name: is_pit_out_lap
    data_type: BOOLEAN
    description: Source pit-out-lap flag. It does not identify all pit-in or safety-car laps.
  - column_name: lap_duration
    data_type: FLOAT
    description: Source lap duration in seconds. Null means unavailable/incomplete, not zero.
  - column_name: segments_sector_1
    data_type: JSON
    description: JSON array of source mini-sector status codes for sector 1; not durations.
  - column_name: segments_sector_2
    data_type: JSON
    description: JSON array of source mini-sector status codes for sector 2; not durations.
  - column_name: segments_sector_3
    data_type: JSON
    description: JSON array of source mini-sector status codes for sector 3; not durations.
  - column_name: st_speed
    data_type: INTEGER
    description: Speed-trap speed in km/h.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: timed_laps
    sql_expression: COUNTIF(t.lap_duration > 0)
    description: Laps with a positive recorded duration; excludes missing and nonpositive timings.
  - measure_name: fastest_lap_seconds
    sql_expression: MIN(IF(t.lap_duration > 0, t.lap_duration, NULL))
    description: Minimum positive recorded lap time. Not automatically an official fastest-lap award.
  - measure_name: average_lap_seconds
    sql_expression: AVG(IF(t.lap_duration > 0, t.lap_duration, NULL))
    description: Mean positive timed lap, including pit/safety-car effects unless explicitly filtered. Not clean-air
      pace.
  - measure_name: lap_time_stddev_seconds
    sql_expression: STDDEV_POP(IF(t.lap_duration > 0, t.lap_duration, NULL))
    description: Variation in positive lap durations; compare within driver/session and an explicit comparable-lap
      cohort.
  - measure_name: pit_out_laps
    sql_expression: COUNTIF(t.is_pit_out_lap)
    description: Rows explicitly marked as pit-out laps; not the number of stationary pit stops.
  - measure_name: best_duration_sector_1_seconds
    sql_expression: MIN(IF(t.duration_sector_1 > 0, t.duration_sector_1, NULL))
    description: Best positive recorded sector time in seconds. Best sectors may come from different laps; their
      sum is theoretical, not an actual lap.
  - measure_name: best_duration_sector_2_seconds
    sql_expression: MIN(IF(t.duration_sector_2 > 0, t.duration_sector_2, NULL))
    description: Best positive recorded sector time in seconds. Best sectors may come from different laps; their
      sum is theoretical, not an actual lap.
  - measure_name: best_duration_sector_3_seconds
    sql_expression: MIN(IF(t.duration_sector_3 > 0, t.duration_sector_3, NULL))
    description: Best positive recorded sector time in seconds. Best sectors may come from different laps; their
      sum is theoretical, not an actual lap.
  - measure_name: max_i_1_speed_kmh
    sql_expression: MAX(t.i_1_speed)
    description: Highest recorded trap speed in km/h; not an average lap speed.
  - measure_name: max_i_2_speed_kmh
    sql_expression: MAX(t.i_2_speed)
    description: Highest recorded trap speed in km/h; not an average lap speed.
  - measure_name: max_st_speed_kmh
    sql_expression: MAX(t.st_speed)
    description: Highest recorded trap speed in km/h; not an average lap speed.
- table_name: f1.location
  description: One driver/session location sample at its source timestamp. Sampling differs from car_data; no timestamp
    equality is assumed.
  primary_key:
  - session_key
  - driver_number
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: x
    data_type: INTEGER
    description: Source approximate X coordinate in a local track reference system; not longitude.
  - column_name: y
    data_type: INTEGER
    description: Source approximate Y coordinate in a local track reference system; not latitude.
  - column_name: z
    data_type: INTEGER
    description: Source approximate Z coordinate; do not assume precise surveyed elevation or derive distance without
      validation.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.meetings
  description: One meeting, including testing events. Geography is reached through circuit_key.
  primary_key:
  - meeting_key
  row_filter: 'TRUE'
  dimensions:
  - column_name: meeting_key
    data_type: INTEGER
    description: OpenF1 event/weekend identifier; a meeting contains several sessions and may be a testing event.
  - column_name: circuit_key
    data_type: INTEGER
    description: OpenF1 circuit identifier.
  - column_name: meeting_name
    data_type: STRING
    description: Short event name.
  - column_name: meeting_official_name
    data_type: STRING
    description: Official event name.
  - column_name: year
    data_type: INTEGER
    description: Season year, not a count.
  - column_name: date_start
    data_type: TIMESTAMP
    description: Source start timestamp in UTC; session schedule is not a hard boundary for captured observations.
  - column_name: date_end
    data_type: TIMESTAMP
    description: Source end timestamp in UTC.
  - column_name: gmt_offset
    data_type: STRING
    description: Source local-time offset string; timestamps remain UTC.
  - column_name: is_cancelled
    data_type: BOOLEAN
    description: Source cancellation indicator; null is unknown, not an explicit true.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.overtakes
  description: One source position exchange between two session entries. Includes pit-stop and penalty changes,
    not exclusively on-track passes; feed may be incomplete.
  primary_key:
  - session_key
  - date
  - overtaking_driver_number
  - overtaken_driver_number
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: overtaken_driver_number
    data_type: INTEGER
    description: Session-scoped number of the driver losing the position; use the overtaken role join.
  - column_name: overtaking_driver_number
    data_type: INTEGER
    description: Session-scoped number of the driver gaining the position; use the overtaking role join.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: position
    data_type: INTEGER
    description: Source position associated with the recorded exchange; not a count of passes.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.pit
  description: One pit-lane event, keyed by session, driver number and timestamp. lane_duration includes transit;
    pit_duration is its deprecated alias, verified equal in all profiled 2025 rows. Stationary stop_duration is available
    for 702 of 821 profiled 2025 events; a missing value does not establish a drive-through.
  primary_key:
  - session_key
  - driver_number
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: lane_duration
    data_type: FLOAT
    description: Time in the pit lane, seconds; includes travel and a stop when present.
  - column_name: lap_number
    data_type: INTEGER
    description: Lap ordinal within a driver/session; not an elapsed count to sum.
  - column_name: pit_duration
    data_type: FLOAT
    description: Deprecated source alias for lane_duration (seconds). All 821 profiled 2025 rows agree exactly. Prefer
      lane_duration; never add these two columns together.
  - column_name: stop_duration
    data_type: FLOAT
    description: Stationary pit-stop duration in seconds; null does not prove there was no stop.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: average_lane_duration_seconds
    sql_expression: AVG(IF(t.lane_duration > 0, t.lane_duration, NULL))
    description: AVG of positive recorded lane_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: fastest_lane_duration_seconds
    sql_expression: MIN(IF(t.lane_duration > 0, t.lane_duration, NULL))
    description: MIN of positive recorded lane_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: total_lane_duration_seconds
    sql_expression: SUM(IF(t.lane_duration > 0, t.lane_duration, NULL))
    description: SUM of positive recorded lane_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: average_stop_duration_seconds
    sql_expression: AVG(IF(t.stop_duration > 0, t.stop_duration, NULL))
    description: AVG of positive recorded stop_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: fastest_stop_duration_seconds
    sql_expression: MIN(IF(t.stop_duration > 0, t.stop_duration, NULL))
    description: MIN of positive recorded stop_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: total_stop_duration_seconds
    sql_expression: SUM(IF(t.stop_duration > 0, t.stop_duration, NULL))
    description: SUM of positive recorded stop_duration in seconds. Null/nonpositive values are excluded. Keep lane
      transit and stationary stop separate; not race time lost to a pit strategy.
  - measure_name: timed_stationary_stops
    sql_expression: COUNTIF(t.stop_duration > 0)
    description: Positive stationary timings available, not total pit visits. In the 2025 profile, 702 of 821 visits; report
      this coverage with stop-time aggregates.
- table_name: f1.position
  description: One running-order observation per driver entry and source timestamp.
  primary_key:
  - session_key
  - driver_number
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: position
    data_type: INTEGER
    description: Running-order rank at this observation; not final classified position or elapsed time in rank.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: best_observed_position
    sql_expression: MIN(t.position)
    description: Best sampled running rank; not finishing rank. Observation counts do not measure laps or time led.
- table_name: f1.race_control
  description: One timestamped race-control message. Driver reference is optional; message_id identifies a message within a session.
  primary_key:
  - session_key
  - message_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: message_id
    data_type: STRING
    description: Opaque message identifier, unique together with session_key. It is not an incident identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: category
    data_type: STRING
    description: Source race-control message category.
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: flag
    data_type: STRING
    description: Source flag code, when present.
  - column_name: lap_number
    data_type: INTEGER
    description: Lap ordinal within a driver/session; not an elapsed count to sum.
  - column_name: message
    data_type: STRING
    description: Verbatim race-control message. Messages are not automatically distinct incidents or penalties.
  - column_name: qualifying_phase
    data_type: STRING
    description: Source qualifying phase, when present; current detailed coverage is Race.
  - column_name: scope
    data_type: STRING
    description: Source scope label; interpretation is specific to this table.
  - column_name: sector
    data_type: INTEGER
    description: Source sector number when the message is sector-scoped.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: flag_message_count
    sql_expression: COUNTIF(t.flag IS NOT NULL)
    description: Messages carrying a flag. Not the number or duration of safety-car/red-flag incidents; reconstruct
      event intervals first.
- table_name: f1.session_entries
  description: One source driver entry per session and driver number. Team membership and driver identity are explicit;
    no Qualifying entries are fabricated.
  primary_key:
  - session_key
  - driver_number
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: driver_id
    data_type: STRING
    description: Canonical person ID derived from source names; not guaranteed stable across spelling changes or
      future seasons.
  - column_name: team_id
    data_type: STRING
    description: Team ID derived from the source team name; changes of name are not automatically reconciled.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: distinct_drivers
    sql_expression: COUNT(DISTINCT t.driver_id)
    description: People represented by entries in the selected scope; not race starts. Non-additive across races
      or teams.
  - measure_name: distinct_teams
    sql_expression: COUNT(DISTINCT t.team_id)
    description: Teams represented by entries in the selected scope; non-additive across sessions.
- table_name: f1.session_result
  description: One Race result per driver entry. Finish position, race points, laps completed and DNS/DNF/DSQ indicators
    are preserved.
  primary_key:
  - session_key
  - driver_number
  row_filter: 'TRUE'
  dimensions:
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: dnf
    data_type: BOOLEAN
    description: Source did-not-finish flag; independent of DNS/DSQ.
  - column_name: dns
    data_type: BOOLEAN
    description: Source did-not-start flag; an entry does not necessarily imply a race start.
  - column_name: dsq
    data_type: BOOLEAN
    description: Source disqualification flag.
  - column_name: duration
    data_type: FLOAT
    description: Source Race result duration in seconds; do not treat as a lap duration.
  - column_name: gap_to_leader
    data_type: STRING
    description: 'Source gap string: seconds or labels such as +1 LAP. Preserve labels; SAFE_CAST only parses numeric
      gaps.'
  - column_name: number_of_laps
    data_type: INTEGER
    description: Completed laps reported in the session result, distinct from lap rows with partial timing.
  - column_name: position
    data_type: INTEGER
    description: Final classified Race position; lower is better. Use DNF/DNS/DSQ flags separately.
  - column_name: points
    data_type: FLOAT
    description: Points awarded in this Grand Prix result. Summable across drivers/races, but excludes Sprint points.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: race_points
    sql_expression: SUM(t.points)
    description: Grand Prix result points; additive across entries and races. Sprint points are not included, so
      this need not equal championship totals.
  - measure_name: wins
    sql_expression: COUNTIF(t.position = 1 AND NOT COALESCE(t.dsq, FALSE))
    description: Classified wins in the selected Race results.
  - measure_name: podiums
    sql_expression: COUNTIF(t.position BETWEEN 1 AND 3 AND NOT COALESCE(t.dsq, FALSE))
    description: Classified top-three Race results.
  - measure_name: dnf_count
    sql_expression: COUNTIF(t.dnf)
    description: Results explicitly marked DNF; nulls are not counted.
  - measure_name: dns_count
    sql_expression: COUNTIF(t.dns)
    description: Results explicitly marked DNS; do not equate entries to starts.
  - measure_name: dsq_count
    sql_expression: COUNTIF(t.dsq)
    description: Results explicitly marked DSQ; flags can overlap other classifications.
  - measure_name: completed_laps
    sql_expression: SUM(t.number_of_laps)
    description: Driver-laps completed according to results. Across drivers this is not the race distance in laps.
  - measure_name: average_finish_position
    sql_expression: AVG(t.position)
    description: Mean available classified rank across selected results; not additive. State treatment of DNS/DNF/DSQ.
  - measure_name: average_result_duration_seconds
    sql_expression: AVG(t.duration)
    description: Mean available source Race duration; comparisons require comparable race lengths and classification.
      Not sum of lap samples.
- table_name: f1.sessions
  description: One scheduled session. Meeting carries year and circuit; detailed data remains restricted to selected
    Race sessions except grids.
  primary_key:
  - session_key
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: meeting_key
    data_type: INTEGER
    description: OpenF1 event/weekend identifier; a meeting contains several sessions and may be a testing event.
  - column_name: session_name
    data_type: STRING
    description: Specific session name. Use exact Race for Grand Prix detail; exclude Sprint and Sprint Qualifying.
  - column_name: session_type
    data_type: STRING
    description: Source session category; session_name is needed to distinguish main Race from Sprint.
  - column_name: date_start
    data_type: TIMESTAMP
    description: Source start timestamp in UTC; session schedule is not a hard boundary for captured observations.
  - column_name: date_end
    data_type: TIMESTAMP
    description: Source end timestamp in UTC.
  - column_name: gmt_offset
    data_type: STRING
    description: Source local-time offset string; timestamps remain UTC.
  - column_name: is_cancelled
    data_type: BOOLEAN
    description: Source cancellation indicator; null is unknown, not an explicit true.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: grand_prix_count
    sql_expression: COUNTIF(t.session_name = 'Race' AND NOT COALESCE(t.is_cancelled, FALSE))
    description: Scheduled noncancelled main Race sessions; excludes Sprint and testing. Consult sync_status before
      assuming detail is complete.
- table_name: f1.starting_grid
  description: One driver grid record per main Qualifying session. Join to Race via meeting_key through sessions,
    never by equating Race and Qualifying keys. Preserves qualifying lap_duration.
  primary_key:
  - session_key
  - driver_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: driver_id
    data_type: STRING
    description: Canonical person ID derived from source names; not guaranteed stable across spelling changes or
      future seasons.
  - column_name: lap_duration
    data_type: FLOAT
    description: Source lap duration in seconds. Null means unavailable/incomplete, not zero.
  - column_name: position
    data_type: INTEGER
    description: Position in the OpenF1 grid published under main Qualifying. Do not assume it incorporates every
      later grid penalty or pit-lane start.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: best_qualifying_lap_seconds
    sql_expression: MIN(IF(t.lap_duration > 0, t.lap_duration, NULL))
    description: Minimum positive lap duration supplied on the Qualifying-keyed grid. Not a full qualifying-lap
      history.
  - measure_name: average_grid_position
    sql_expression: AVG(t.position)
    description: Mean source qualifying-grid position. Later penalties/pit-lane starts may differ.
- table_name: f1.stints
  description: One tyre stint per driver entry; lap bounds and tyre age are preserved.
  primary_key:
  - session_key
  - driver_number
  - stint_number
  row_filter: 'TRUE'
  dimensions:
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: stint_number
    data_type: INTEGER
    description: Source tyre-stint ordinal within an entry.
  - column_name: compound
    data_type: STRING
    description: Source tyre compound label.
  - column_name: lap_end
    data_type: INTEGER
    description: Source inclusive last lap of the stint; may be missing. Do not assume nonoverlapping ranges.
  - column_name: lap_start
    data_type: INTEGER
    description: Source inclusive first lap of the stint. Boundaries can overlap adjacent stints.
  - column_name: tyre_age_at_start
    data_type: INTEGER
    description: Tyre age in laps at stint start, including prior use; not the stint length.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: average_reported_span_laps
    sql_expression: AVG(IF(t.lap_end >= t.lap_start, t.lap_end - t.lap_start + 1, NULL))
    description: Mean inclusive reported stint span. Boundaries overlap in this dataset; do not sum spans as distinct
      laps or use an unchecked many-one lap join.
  - measure_name: average_starting_tyre_age_laps
    sql_expression: AVG(t.tyre_age_at_start)
    description: Mean source tyre age at stint start, not total tyre life.
- table_name: f1.sync_status
  description: Data availability by endpoint and scope. Use this to distinguish unavailable detail from zero
    recorded events. Metadata scopes have no session; HTTP 404 means unavailable.
  primary_key:
  - endpoint
  - scope
  row_filter: 'TRUE'
  dimensions:
  - column_name: endpoint
    data_type: STRING
    description: OpenF1 endpoint for this request scope.
  - column_name: scope
    data_type: STRING
    description: Coverage identifier for metadata, a session, or a driver within a session, depending on endpoint.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: status
    data_type: STRING
    description: Source retrieval/availability status. Missing/unavailable data is not evidence of zero events.
  - column_name: row_count
    data_type: INTEGER
    description: Source row count for one completed request scope; compare within an endpoint, not across unrelated
      grains.
  - column_name: completed_at
    data_type: TIMESTAMP
    description: Availability timestamp for this scope; not event time or evidence that every scope is current.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: unavailable_scope_count
    sql_expression: COUNTIF(t.status = 'unavailable_404')
    description: Scopes reported unavailable by HTTP 404. Does not imply zero source activity.
  - measure_name: reported_source_rows
    sql_expression: SUM(t.row_count)
    description: Sum disjoint completed scopes within one endpoint only; different endpoints have incompatible grains.
      Not a total number of F1 events.
  - measure_name: latest_scope_completion
    sql_expression: MAX(t.completed_at)
    description: Latest availability timestamp among selected scopes; other scopes may be older or unavailable.
- table_name: f1.team_radio
  description: One radio recording per driver entry, timestamp and recording URL. Audio is referenced, not transcribed.
  primary_key:
  - session_key
  - driver_number
  - date
  - recording_url
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: driver_number
    data_type: INTEGER
    description: Car number scoped to a session entry; never a permanent person identifier.
  - column_name: recording_url
    data_type: STRING
    description: Audio recording URL. No audio transcript is stored in this table.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.team_sessions
  description: One team appearance per session; preserves the source team colour as observed in that session.
  primary_key:
  - session_key
  - team_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: team_id
    data_type: STRING
    description: Team ID derived from the source team name; changes of name are not automatically reconciled.
  - column_name: team_colour
    data_type: STRING
    description: Source display colour for this team in this session; may vary across the season.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.team_standings
  description: One team championship checkpoint per Race session. Source checkpoint snapshots may disagree with
    later classified results; driver checkpoint changes differ from Race result points in 23 profiled 2025 rows.
  primary_key:
  - session_key
  - team_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: team_id
    data_type: STRING
    description: Team ID derived from the source team name; changes of name are not automatically reconciled.
  - column_name: points_current
    data_type: FLOAT
    description: Championship points as recorded at this session checkpoint. May reflect a during/post-race state
      that omits later corrections; never sum across checkpoints.
  - column_name: points_start
    data_type: FLOAT
    description: Cumulative championship points before this checkpoint. Not race points.
  - column_name: position_current
    data_type: INTEGER
    description: Championship rank as recorded at this session checkpoint, potentially before later corrections;
      lower is better; not additive.
  - column_name: position_start
    data_type: INTEGER
    description: Championship rank before this checkpoint; lower is better.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: checkpoint_points
    sql_expression: SUM(t.points_current)
    description: 'SEMI-ADDITIVE: filter to exactly one session checkpoint first. Sum across distinct drivers/teams
      only; never sum across checkpoints. Do not replace latest points with MAX(points), because adjustments can
      reduce points. Source snapshot may predate later result corrections.'
  - measure_name: checkpoint_points_change
    sql_expression: SUM(t.points_current - t.points_start)
    description: Change within the recorded before/after checkpoint. Not guaranteed to equal Race result points
      or cover Sprint points between snapshots; do not call this complete seasonal points earned. Source snapshot
      may predate later result corrections.
  - measure_name: checkpoint_rank
    sql_expression: MIN(t.position_current)
    description: Filter to exactly one checkpoint and one driver/team. MIN is a scalar projection at that grain,
      not a seasonal rank or meaningful rank across entities. Source snapshot may predate later result corrections.
- table_name: f1.teams
  description: One team per team_id. Session-specific colours are in team_sessions. Team identity continuity
    across name changes is not guaranteed.
  primary_key:
  - team_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: team_id
    data_type: STRING
    description: Team ID derived from the source team name; changes of name are not automatically reconciled.
  - column_name: team_name
    data_type: STRING
    description: Source team name.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
- table_name: f1.weather
  description: One session weather observation per source timestamp. No driver reference.
  primary_key:
  - session_key
  - date
  row_filter: 'TRUE'
  dimensions:
  - column_name: date
    data_type: TIMESTAMP
    description: Source observation/event timestamp in UTC. Different feeds have independent sampling clocks.
  - column_name: session_key
    data_type: INTEGER
    description: OpenF1 session identifier. Race and Qualifying have different keys even within one meeting.
  - column_name: air_temperature
    data_type: FLOAT
    description: Ambient air temperature in degrees Celsius.
  - column_name: humidity
    data_type: FLOAT
    description: Relative humidity percent.
  - column_name: pressure
    data_type: FLOAT
    description: Air pressure in mbar.
  - column_name: rainfall
    data_type: INTEGER
    description: Source rainfall indicator (0/1); not precipitation depth or duration.
  - column_name: track_temperature
    data_type: FLOAT
    description: Track surface temperature in degrees Celsius.
  - column_name: wind_direction
    data_type: INTEGER
    description: Wind direction in degrees; circular, so ordinary arithmetic means are misleading.
  - column_name: wind_speed
    data_type: FLOAT
    description: Wind speed in metres per second.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of rows at this table's stated primary-key grain after its row_filter. Aggregate before
      any one-many expansion; never infer events from an unavailable scope.
  - measure_name: average_sample_air_temperature
    sql_expression: AVG(t.air_temperature)
    description: Sample-weighted mean in the units documented on the dimension. Not time-weighted; weather is session-level,
      independent of driver samples.
  - measure_name: average_sample_track_temperature
    sql_expression: AVG(t.track_temperature)
    description: Sample-weighted mean in the units documented on the dimension. Not time-weighted; weather is session-level,
      independent of driver samples.
  - measure_name: average_sample_humidity
    sql_expression: AVG(t.humidity)
    description: Sample-weighted mean in the units documented on the dimension. Not time-weighted; weather is session-level,
      independent of driver samples.
  - measure_name: average_sample_pressure
    sql_expression: AVG(t.pressure)
    description: Sample-weighted mean in the units documented on the dimension. Not time-weighted; weather is session-level,
      independent of driver samples.
  - measure_name: average_sample_wind_speed
    sql_expression: AVG(t.wind_speed)
    description: Sample-weighted mean in the units documented on the dimension. Not time-weighted; weather is session-level,
      independent of driver samples.
  - measure_name: rainy_sample_fraction
    sql_expression: SAFE_DIVIDE(COUNTIF(t.rainfall = 1), COUNT(t.rainfall))
    description: Fraction of nonnull observations flagged as rain. Not rainfall depth or percentage of elapsed race
      time.
  - measure_name: maximum_track_temperature_c
    sql_expression: MAX(t.track_temperature)
    description: Maximum recorded track temperature in degrees Celsius.
- table_name: f1.document_passages_search
  description: One searchable chunk per passage_id, with original text and document metadata for context and citation.
    Use AI.SEARCH on embedding_text with mode HYBRID and topic filters. Similarity is retrieval evidence, not exhaustive mentions, verified attribution or legal
    applicability.
  primary_key:
  - passage_id
  row_filter: 'TRUE'
  dimensions:
  - column_name: document_type
    data_type: STRING
    description: 'Source topic: transcript, regulation or glossary. Filter this before topic-specific analysis.'
  - column_name: document_id
    data_type: STRING
    description: Document identifier; with document_type and source_position identifies the original text
      block.
  - column_name: source_position
    data_type: INTEGER
    description: Zero-based block order within a document. Repeated across chunks; select chunk_index = 0 to read
      each complete text block once, ordered by source_position.
  - column_name: text
    data_type: STRING
    description: Complete original source block, repeated for each of its chunks. Use chunk_text for a retrieved
      excerpt and text for its immediate context.
  - column_name: question
    data_type: STRING
    description: Complete source-markup question, when identified; null in regulations/glossary. Not a generated
      question.
  - column_name: speaker_label
    data_type: STRING
    description: Literal source speaker or section label. Not a verified driver identity; glossary labels can be Example.
  - column_name: section
    data_type: STRING
    description: Source section heading, when available; not a globally unique rule/article identifier.
  - column_name: page_number
    data_type: INTEGER
    description: Source PDF page number, when available; not the block ordinal or chunk index.
  - column_name: title
    data_type: STRING
    description: Parent document title identifying conference, regulation edition or glossary page.
  - column_name: source_url
    data_type: STRING
    description: Parent source URL for citation and provenance.
  - column_name: published_at
    data_type: STRING
    description: Parent publication date/time as source STRING. Publication time is not event time or proof of legal
      applicability.
  - column_name: meeting_key
    data_type: INTEGER
    description: Recorded transcript meeting association; null for glossary/regulations. Not inferred from
      passage text.
  - column_name: race_name
    data_type: STRING
    description: Transcript race label from the parent document; null for other topics.
  - column_name: conference_type
    data_type: STRING
    description: Transcript conference type, including post-race. Null for non-transcripts.
  - column_name: association_method
    data_type: STRING
    description: Provenance of the transcript-to-meeting association; null for other topics.
  - column_name: applicable_season
    data_type: INTEGER
    description: Regulation season annotation; insufficient to establish article applicability at a particular race.
  - column_name: rule_family
    data_type: STRING
    description: Regulation family such as sporting or technical; null for other topics.
  - column_name: applicability_status
    data_type: STRING
    description: Source applicability caveat for a regulation/glossary document; null for transcripts.
  - column_name: effective_from
    data_type: STRING
    description: Source regulation effective-date string, if known. Current editions are unknown; never infer from
      publication.
  - column_name: effective_to
    data_type: STRING
    description: Source regulation end-of-effectivity string, if known; unknown remains null.
  - column_name: chunk_text
    data_type: STRING
    description: Contiguous group of at most 120 whitespace-delimited words from the source block, with original
      whitespace retained.
  - column_name: chunk_index
    data_type: INTEGER
    description: Zero-based chunk within the original block; ordered chunk_text concatenation reconstructs that
      block.
  - column_name: passage_id
    data_type: STRING
    description: Opaque search chunk identifier. The equivalent natural key is document_type, document_id,
      source_position and chunk_index; use these fields to locate the original text.
  - column_name: embedding_text
    data_type: STRING
    description: 'Text searched by semantic and keyword retrieval: full chunk plus bounded title/heading/question/label
      and neighboring glossary blocks. Context may mention another concept or person; verify chunk_text and original
      source.'
  - column_name: content_hash
    data_type: STRING
    description: Fingerprint of the chunk text, context and metadata. It is not a document or passage identifier;
      use passage_id for chunk identity.
  - column_name: embedding
    data_type: RECORD
    description: Semantic representation as a STRUCT with result ARRAY<FLOAT64> (768 dimensions, text-embedding-005)
      and status STRING. NULL is pending; empty status and a 768-element result indicate success; nonempty status
      reports an error. Never aggregate vector coordinates. AI.SEARCH skips missing embeddings.
  measures:
  - measure_name: row_count
    sql_expression: COUNT(*)
    description: Number of chunks, not documents, rules, utterances or incidents.
  - measure_name: document_count
    sql_expression: COUNT(DISTINCT TO_JSON_STRING(STRUCT(t.document_type, t.document_id)))
    description: Distinct source documents represented by these chunks.
  - measure_name: source_block_count
    sql_expression: COUNT(DISTINCT TO_JSON_STRING(STRUCT(t.document_type, t.document_id, t.source_position)))
    description: Distinct original text blocks; one block can contain multiple search chunks.
  - measure_name: embedding_ready_count
    sql_expression: COUNTIF(t.embedding.status = '' AND ARRAY_LENGTH(t.embedding.result) = 768)
    description: Chunks with a usable 768-dimensional embedding; compare with row_count to assess search coverage.
  - measure_name: embedding_error_count
    sql_expression: COUNTIF(t.embedding.status != '')
    description: Chunks whose embedding status reports an error; these lack a successful semantic representation.
joins:
- join_name: circuits_to_countries
  from_table: f1.circuits
  to_table: f1.countries
